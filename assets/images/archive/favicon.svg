<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A1838"/>
      <stop offset="60%" stop-color="#15243C"/>
      <stop offset="100%" stop-color="#0B1524"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D379"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#8C6610"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Decorative inner ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.8"/>
  <!-- Monogram text DA -->
  <text x="32" y="38" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">DA</text>
  <!-- Mic spark indicator -->
  <circle cx="32" cy="46" r="1.5" fill="#F2D379"/>
</svg>
